name: Report a Tabvento bug
description: Share a reproducible issue without sensitive data.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and expected behavior
      description: Include your operating system, Python version, and whether this was a simulated demo or live mission. Do not include keys, cookies, or private tasks.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Logs or screenshots
      description: Optional. Remove credentials and personal information before attaching anything.
