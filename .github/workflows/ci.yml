name: Tabvento CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANONYMIZED_TELEMETRY: 'false'
  BH_TELEMETRY: '0'

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - run: uv sync --locked --dev --all-extras --python ${{ matrix.python }}
      - run: uv run --no-sync pytest tests -m "not chrome" --junitxml=python-results.xml
      - name: Report Python test failures
        if: always()
        run: uv run --no-sync python scripts/ci_test_summary.py python-results.xml
      - run: uv run --no-sync ruff check --no-fix
      - run: uv run --no-sync pyright
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: npm ci --prefix tests/frontend
      - run: npm test --prefix tests/frontend

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --locked --dev --all-extras --python 3.12
      - run: |
          CHROME="$(command -v google-chrome)" || { echo "google-chrome not found on PATH" >&2; exit 1; }
          CHROME="$CHROME" uv run --no-sync pytest tests -m chrome -rs --junitxml=chrome-results.xml
      - name: Report Chrome test failures
        if: always()
        run: uv run --no-sync python scripts/ci_test_summary.py chrome-results.xml
